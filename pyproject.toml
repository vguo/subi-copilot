[project]
name = "sub-i-copilot"
version = "0.1.0"
description = "Handoff Copilot — personal tool for processing overnight clinical sign-outs."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "faster-whisper>=1.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
